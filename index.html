<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Work Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
    .hideScroll::-webkit-scrollbar{display:none}
    .hideScroll{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fadeIn{animation:fadeIn .25s ease-out}
    @keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
    .pulse2{animation:pulse2 1.5s infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin .8s linear infinite}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    input[type="date"],input[type="time"]{min-height:44px}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var{useState,useRef,useMemo,useEffect}=React;

/* ══════════ CONFIG ══════════ */
var API_URL = "https://script.google.com/macros/s/AKfycbyZrP3PBIJvZaG9PJwO58uctQAbp6FYN8NOAtqFe1Q9csfeVDj5XVf0DylKo8jIRNzRdQ/exec";

/* ══════════ API HELPERS ══════════ */
async function apiGet(){
  try{var r=await fetch(API_URL+"?t="+Date.now());var t=await r.text();return JSON.parse(t)}
  catch(e){console.error("GET err:",e);return{success:false,error:e.message}}
}
async function apiPost(data){
  try{var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});var t=await r.text();return JSON.parse(t)}
  catch(e){console.error("POST err:",e);return{success:false,error:e.message}}
}
async function uploadFileToDrive(file){
  var dataUrl=await new Promise(function(res){var r=new FileReader();r.onload=function(e){res(e.target.result)};r.readAsDataURL(file)});
  var base64=dataUrl.split(",")[1];
  var resp=await apiPost({action:"uploadFile",fileName:file.name,mimeType:file.type,base64Data:base64});
  if(resp&&resp.success)return{id:resp.data.driveFileId,name:resp.data.name,type:resp.data.type,driveFileId:resp.data.driveFileId,viewUrl:resp.data.viewUrl,downloadUrl:resp.data.downloadUrl,isImg:resp.data.isImg,isPdf:resp.data.isPdf};
  return null;
}

/* ══════════ DRIVE DELETE HELPER ══════════ */
function deleteDriveFile(fid){apiPost({action:"deleteFile",driveFileId:fid})}
function deleteDriveFiles(files){if(files&&files.length)files.forEach(function(f){deleteDriveFile(f.driveFileId||f.id)})}

/* ══════════ HELPERS ══════════ */
function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function fmtDate(s){if(!s)return"";var d=new Date(s);var wd=["日","一","二","三","四","五","六"];return(d.getMonth()+1)+"月"+d.getDate()+"日（"+wd[d.getDay()]+"）"}
function fmtTime(s){if(!s)return"";var p=s.split(":");return p[0]+":"+p[1]}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function deadlineInfo(dl){if(!dl)return null;var now=new Date();now.setHours(0,0,0,0);var d=new Date(dl);d.setHours(0,0,0,0);var diff=Math.ceil((d-now)/(864e5));if(diff<0)return{t:"已過期 "+Math.abs(diff)+"日",c:"bg-red-100 text-red-600 border-red-200",ic:"🔴",urgent:true};if(diff===0)return{t:"今日到期",c:"bg-orange-100 text-orange-600 border-orange-200",ic:"🟠",urgent:true};if(diff<=3)return{t:diff+"日後到期",c:"bg-amber-100 text-amber-600 border-amber-200",ic:"🟡",urgent:false};return{t:diff+"日後",c:"bg-emerald-100 text-emerald-600 border-emerald-200",ic:"🟢",urgent:false}}

var PRI={red:{l:"緊急",bg:"bg-red-50",bd:"border-red-300",bar:"bg-red-400",badge:"bg-red-100 text-red-600",ring:"ring-red-200"},orange:{l:"一般",bg:"bg-orange-50",bd:"border-orange-300",bar:"bg-orange-400",badge:"bg-orange-100 text-orange-600",ring:"ring-orange-200"},green:{l:"低",bg:"bg-emerald-50",bd:"border-emerald-300",bar:"bg-emerald-400",badge:"bg-emerald-100 text-emerald-600",ring:"ring-emerald-200"}};
var IC="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-300";
var BTN="bg-gradient-to-r from-indigo-500 to-violet-500 text-white font-bold px-5 py-3 rounded-xl shadow-sm active:scale-95 transition-transform";
var BTN2="bg-gray-100 text-gray-500 font-bold px-4 py-3 rounded-xl";

/* ══════════ SHARED COMPONENTS ══════════ */
function Empty({icon,title,sub}){return<div className="bg-white rounded-2xl p-10 text-center border-2 border-dashed border-gray-200 fadeIn"><div className="text-5xl mb-3">{icon||"📭"}</div><div className="text-base font-bold text-gray-400 mb-1">{title||"未有資料"}</div>{sub&&<div className="text-sm text-gray-300">{sub}</div>}</div>}
function DLBadge({dl}){var info=deadlineInfo(dl);if(!info)return null;return<span className={"inline-flex items-center gap-1 text-xs font-bold px-2 py-0.5 rounded-full border "+info.c}>{info.ic} {info.t}</span>}

function FileThumb({files,onView,onRemove}){if(!files||files.length===0)return null;return<div className="flex gap-2 flex-wrap mt-2.5">{files.map(function(f){return<div key={f.id||f.driveFileId} className="relative group"><button onClick={function(){onView(f)}} className="w-16 h-16 rounded-xl border-2 border-gray-200 overflow-hidden bg-gray-50 flex items-center justify-center hover:border-indigo-300 active:scale-95 transition-all">{f.isImg?<img src={f.viewUrl} className="w-full h-full object-cover" onError={function(e){e.target.style.display="none"}}/>:<div className="flex flex-col items-center"><span className="text-2xl">📄</span><span className="text-gray-400 truncate w-14 text-center" style={{fontSize:7}}>{f.name}</span></div>}</button>{onRemove&&<button onClick={function(){onRemove(f.id||f.driveFileId)}} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-400 text-white text-xs flex items-center justify-center shadow">✕</button>}</div>})}</div>}

function FileModal({file,onClose}){if(!file)return null;return<div className="fixed inset-0 bg-black bg-opacity-85 z-50 flex items-center justify-center p-4" onClick={onClose}><div className="relative w-full max-w-3xl" onClick={function(e){e.stopPropagation()}}><button onClick={onClose} className="absolute -top-12 right-0 w-10 h-10 rounded-full bg-white bg-opacity-20 text-white text-xl flex items-center justify-center">✕</button>{file.isImg?<img src={file.viewUrl} className="w-full max-h-screen object-contain rounded-xl"/>:<div className="bg-white rounded-2xl p-8 text-center"><div className="text-6xl mb-4">📄</div><div className="text-base font-bold text-gray-700 mb-2">{file.name}</div><a href={file.viewUrl} target="_blank" rel="noopener noreferrer" className={"inline-block "+BTN}>📂 打開檔案</a>{file.downloadUrl&&<div className="mt-3"><a href={file.downloadUrl} target="_blank" rel="noopener noreferrer" className="text-sm font-bold text-indigo-500">📥 下載</a></div>}<p className="text-xs text-gray-400 mt-4">會喺新分頁開啟 Google Drive</p></div>}</div></div>}

function ConfirmModal({show,title,msg,onYes,onNo}){if(!show)return null;return<div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-end sm:items-center justify-center p-4" onClick={onNo}><div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl fadeIn" onClick={function(e){e.stopPropagation()}}><div className="text-center mb-5"><div className="text-3xl mb-2">⚠️</div><div className="text-base font-black text-gray-700">{title||"確認刪除？"}</div>{msg&&<div className="text-sm text-gray-400 mt-1">{msg}</div>}</div><div className="flex gap-3"><button onClick={onNo} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100">取消</button><button onClick={onYes} className="flex-1 py-3 rounded-xl font-bold text-white bg-red-500 shadow-sm">確認刪除</button></div></div></div>}

function SectionHeader({icon,title,count,action,actionLabel,actionIcon}){return<div className="flex items-center justify-between mb-3"><div className="flex items-center gap-2"><span className="text-xl">{icon}</span><span className="text-base font-black text-gray-700">{title}</span>{count!=null&&count>0&&<span className="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-600">{count}</span>}</div>{action&&<button onClick={action} className="flex items-center gap-1.5 text-sm font-bold text-indigo-500 bg-indigo-50 px-3.5 py-2 rounded-xl border border-indigo-200 active:scale-95 transition-transform"><span>{actionIcon||"+"}</span><span>{actionLabel||"新增"}</span></button>}</div>}

function UploadBtn({inputRef,uploading,label}){return<div>{uploading?<div className="w-full py-3 rounded-xl border-2 border-dashed border-indigo-200 text-sm font-bold text-indigo-400 flex items-center justify-center gap-2"><div className="w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full spin"/>上傳中...</div>:<button onClick={function(){inputRef.current.click()}} className="w-full py-3 rounded-xl border-2 border-dashed border-indigo-200 text-sm font-bold text-indigo-400 hover:bg-indigo-50 transition-colors">{label||"📎 選擇檔案"}</button>}</div>}

/* ═══════════ MAIN APP ═══════════ */
function App(){
  var[loaded,setLoaded]=useState(false);
  var[loadErr,setLoadErr]=useState(null);
  var[syncing,setSyncing]=useState(false);
  var[lastSaved,setLastSaved]=useState(null);
  var[uploading,setUploading]=useState(false);
  var saveTimers=useRef({});

  var[tab,setTab]=useState("duty");
  var[previewFile,setPF]=useState(null);
  var[confirmDel,setCD]=useState(null);

  /* ── Duty ── */
  var[duties,setDuties]=useState([]);
  var[dutySubTab,setDST]=useState("tasks");
  var[showDF,setSDF]=useState(false);
  var[dfTitle,setDFT]=useState("");var[dfDesc,setDFD]=useState("");var[dfDL,setDFDL]=useState("");var[dfPri,setDFP]=useState("green");var[dfEditId,setDFE]=useState(null);
  var[dutyFilter,setDFilter]=useState("pending");

  var[meetings,setMeetings]=useState([]);
  var[showMF,setSMF]=useState(false);
  var[mfTitle,setMFT]=useState("");var[mfDate,setMFD]=useState("");var[mfTime,setMFTm]=useState("");var[mfFiles,setMFF]=useState([]);var[mfEditId,setMFE]=useState(null);
  var meetRef=useRef(null);

  /* ── IT ── */
  var[itItems,setIT]=useState([]);
  var[showIF,setSIF]=useState(false);
  var[ifTitle,setIFT]=useState("");var[ifDesc,setIFD]=useState("");var[ifDL,setIFDL]=useState("");var[ifEditId,setIFE]=useState(null);
  var[itFilter,setITF]=useState("pending");

  /* ── Staff ── */
  var[staffList,setSL]=useState([]);
  var[newSN,setNSN]=useState("");
  var[selStaff,setSS]=useState("");
  var[staffIssues,setSI]=useState({});
  var[showSIF,setSSIF]=useState(false);
  var[siTitle,setSIT]=useState("");var[siDesc,setSID]=useState("");var[siDate,setSIDate]=useState("");var[siFiles,setSIFiles]=useState([]);var[siEditId,setSIE]=useState(null);
  var siRef=useRef(null);

  /* ── Notes ── */
  var[notes,setNotes]=useState([]);
  var[showNF,setSNF]=useState(false);
  var[nfTitle,setNFT]=useState("");var[nfContent,setNFC]=useState("");var[nfEditId,setNFE]=useState(null);
  var[expandedNote,setEN]=useState({});

  /* ── Debounced Save ── */
  function schedSave(key,action,payload){
    if(saveTimers.current[key])clearTimeout(saveTimers.current[key]);
    setSyncing(true);
    saveTimers.current[key]=setTimeout(function(){
      apiPost(Object.assign({action:action},payload)).then(function(resp){
        setSyncing(false);
        if(resp&&resp.success)setLastSaved(new Date());
      });
    },1500);
  }

  /* ── Load on mount ── */
  useEffect(function(){
    apiGet().then(function(resp){
      if(resp&&resp.success){
        var d=resp.data;
        setDuties(d.duties||[]);
        setMeetings(d.meetings||[]);
        setIT(d.it||[]);
        setSL(d.staffList||[]);
        setSI(d.staffIssues||{});
        var ns=(d.notes||[]).slice().sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)});
        setNotes(ns);
      }else{
        setLoadErr("載入失敗，請檢查 API URL");
      }
      setLoaded(true);
    });
  },[]);

  /* ── Auto-save effects ── */
  useEffect(function(){if(!loaded)return;schedSave("duties","saveDuties",{items:duties})},[duties]);
  useEffect(function(){if(!loaded)return;schedSave("meetings","saveMeetings",{items:meetings})},[meetings]);
  useEffect(function(){if(!loaded)return;schedSave("it","saveIT",{items:itItems})},[itItems]);
  useEffect(function(){if(!loaded)return;schedSave("staffList","saveStaffList",{list:staffList})},[staffList]);
  useEffect(function(){
    if(!loaded)return;
    var items=[];
    Object.keys(staffIssues).forEach(function(name){
      (staffIssues[name]||[]).forEach(function(iss){items.push(Object.assign({staffName:name},iss))});
    });
    schedSave("staffIssues","saveStaffIssues",{items:items});
  },[staffIssues]);
  useEffect(function(){
    if(!loaded)return;
    var items=notes.map(function(n,i){return Object.assign({},n,{sortOrder:i})});
    schedSave("notes","saveNotes",{items:items});
  },[notes]);

  /* ── File upload wrapper ── */
  async function doUploadFiles(fileList){
    setUploading(true);
    var results=[];
    for(var i=0;i<fileList.length;i++){
      var f=await uploadFileToDrive(fileList[i]);
      if(f)results.push(f);
    }
    setUploading(false);
    return results;
  }

  /* ═══ DUTY CRUD ═══ */
  function addDuty(){if(!dfTitle.trim())return;if(dfEditId){setDuties(function(p){return p.map(function(d){return d.id===dfEditId?Object.assign({},d,{title:dfTitle,desc:dfDesc,deadline:dfDL,priority:dfPri}):d})})}else{setDuties(function(p){return[{id:gid(),title:dfTitle,desc:dfDesc,deadline:dfDL,priority:dfPri,completed:false,createdAt:new Date().toISOString()}].concat(p)})}resetDF()}
  function resetDF(){setDFT("");setDFD("");setDFDL("");setDFP("green");setDFE(null);setSDF(false)}
  function editDuty(d){setDFT(d.title);setDFD(d.desc);setDFDL(d.deadline);setDFP(d.priority);setDFE(d.id);setSDF(true)}
  function toggleDuty(id){setDuties(function(p){return p.map(function(d){return d.id===id?Object.assign({},d,{completed:!d.completed}):d})})}
  function delDuty(id){setDuties(function(p){return p.filter(function(d){return d.id!==id})})}
  var fDuties=useMemo(function(){var s=duties.slice().sort(function(a,b){if(a.completed!==b.completed)return a.completed?1:-1;var o={red:0,orange:1,green:2};return o[a.priority]-o[b.priority]});if(dutyFilter==="pending")return s.filter(function(d){return!d.completed});if(dutyFilter==="completed")return s.filter(function(d){return d.completed});return s},[duties,dutyFilter]);
  var pendingCount=duties.filter(function(d){return!d.completed}).length;

  /* ═══ MEETING CRUD ═══ */
  function addMeet(){if(!mfTitle.trim())return;if(mfEditId){setMeetings(function(p){return p.map(function(m){return m.id===mfEditId?Object.assign({},m,{title:mfTitle,date:mfDate,time:mfTime,files:mfFiles}):m})})}else{setMeetings(function(p){return p.concat([{id:gid(),title:mfTitle,date:mfDate,time:mfTime,files:mfFiles,createdAt:new Date().toISOString()}])})}resetMF()}
  function resetMF(){setMFT("");setMFD("");setMFTm("");setMFF([]);setMFE(null);setSMF(false)}
  function editMeet(m){setMFT(m.title);setMFD(m.date);setMFTm(m.time);setMFF(m.files||[]);setMFE(m.id);setSMF(true)}
  function delMeet(id){
    var m=meetings.find(function(x){return x.id===id});
    if(m)deleteDriveFiles(m.files);
    setMeetings(function(p){return p.filter(function(x){return x.id!==id})})
  }
  async function onMeetFile(e){var fs=await doUploadFiles(e.target.files);setMFF(function(p){return p.concat(fs)});e.target.value=""}
  var sMeetings=useMemo(function(){return meetings.slice().sort(function(a,b){var da=new Date(a.date+" "+(a.time||"00:00"));var db=new Date(b.date+" "+(b.time||"00:00"));return da-db})},[meetings]);

  /* ═══ IT CRUD ═══ */
  function addIt(){if(!ifTitle.trim())return;if(ifEditId){setIT(function(p){return p.map(function(i){return i.id===ifEditId?Object.assign({},i,{title:ifTitle,desc:ifDesc,deadline:ifDL}):i})})}else{setIT(function(p){return[{id:gid(),title:ifTitle,desc:ifDesc,deadline:ifDL,completed:false,createdAt:new Date().toISOString()}].concat(p)})}resetIF()}
  function resetIF(){setIFT("");setIFD("");setIFDL("");setIFE(null);setSIF(false)}
  function editIt(i){setIFT(i.title);setIFD(i.desc);setIFDL(i.deadline);setIFE(i.id);setSIF(true)}
  function toggleIt(id){setIT(function(p){return p.map(function(i){return i.id===id?Object.assign({},i,{completed:!i.completed}):i})})}
  function delIt(id){setIT(function(p){return p.filter(function(i){return i.id!==id})})}
  var fIt=useMemo(function(){var s=itItems.slice().sort(function(a,b){if(a.completed!==b.completed)return a.completed?1:-1;if(a.deadline&&b.deadline)return new Date(a.deadline)-new Date(b.deadline);return 0});if(itFilter==="pending")return s.filter(function(i){return!i.completed});if(itFilter==="completed")return s.filter(function(i){return i.completed});return s},[itItems,itFilter]);
  var itPending=itItems.filter(function(i){return!i.completed}).length;

  /* ═══ STAFF CRUD ═══ */
  function addStaff2(){if(!newSN.trim()||staffList.includes(newSN.trim()))return;var u=staffList.concat([newSN.trim()]);setSL(u);setNSN("");if(!selStaff)setSS(newSN.trim())}
  function rmStaff(n){
    (staffIssues[n]||[]).forEach(function(iss){deleteDriveFiles(iss.files)});
    setSL(function(p){return p.filter(function(x){return x!==n})});var ni=Object.assign({},staffIssues);delete ni[n];setSI(ni);if(selStaff===n)setSS("")
  }
  function addIssue(){if(!siTitle.trim()||!selStaff)return;if(siEditId){setSI(function(p){var ni=Object.assign({},p);ni[selStaff]=(ni[selStaff]||[]).map(function(i){return i.id===siEditId?Object.assign({},i,{title:siTitle,desc:siDesc,date:siDate,files:siFiles}):i});return ni})}else{setSI(function(p){var ni=Object.assign({},p);ni[selStaff]=[{id:gid(),title:siTitle,desc:siDesc,date:siDate,files:siFiles,createdAt:new Date().toISOString()}].concat(ni[selStaff]||[]);return ni})}resetSIF()}
  function resetSIF(){setSIT("");setSID("");setSIDate("");setSIFiles([]);setSIE(null);setSSIF(false)}
  function editIssue(i){setSIT(i.title);setSID(i.desc);setSIDate(i.date||"");setSIFiles(i.files||[]);setSIE(i.id);setSSIF(true)}
  function delIssue(sn,id){
    var iss=(staffIssues[sn]||[]).find(function(x){return x.id===id});
    if(iss)deleteDriveFiles(iss.files);
    setSI(function(p){var ni=Object.assign({},p);ni[sn]=(ni[sn]||[]).filter(function(i){return i.id!==id});return ni})
  }
  async function onSIFile(e){var fs=await doUploadFiles(e.target.files);setSIFiles(function(p){return p.concat(fs)});e.target.value=""}
  var curIssues=selStaff?(staffIssues[selStaff]||[]):[];
  var totalIssues=Object.values(staffIssues).reduce(function(s,a){return s+a.length},0);

  /* ═══ NOTES CRUD ═══ */
  function addNote2(){if(!nfTitle.trim())return;if(nfEditId){setNotes(function(p){return p.map(function(n){return n.id===nfEditId?Object.assign({},n,{title:nfTitle,content:nfContent}):n})})}else{setNotes(function(p){return p.concat([{id:gid(),title:nfTitle,content:nfContent,createdAt:new Date().toISOString()}])})}resetNF()}
  function resetNF(){setNFT("");setNFC("");setNFE(null);setSNF(false)}
  function editNote2(n){setNFT(n.title);setNFC(n.content);setNFE(n.id);setSNF(true)}
  function delNote(id){setNotes(function(p){return p.filter(function(n){return n.id!==id})})}
  function moveNote(id,dir){setNotes(function(p){var idx=p.findIndex(function(n){return n.id===id});if(idx<0)return p;var ni=idx+dir;if(ni<0||ni>=p.length)return p;var a=p.slice();var tmp=a[idx];a[idx]=a[ni];a[ni]=tmp;return a})}

  /* ═══ RENDER TABS ═══ */
  var TABS=[{id:"duty",icon:"📋",label:"Duty",count:pendingCount+meetings.length},{id:"it",icon:"💻",label:"IT",count:itPending},{id:"staff",icon:"👥",label:"同事",count:totalIssues},{id:"notes",icon:"📌",label:"公司需知",count:notes.length}];

  /* ── LOADING SCREEN ── */
  if(!loaded){return<div className="min-h-screen flex flex-col items-center justify-center bg-gray-50"><div className="text-5xl mb-4 pulse2">📋</div><div className="text-base font-bold text-gray-400">{loadErr||"載入中..."}</div>{loadErr&&<button onClick={function(){location.reload()}} className={"mt-4 "+BTN}>重試</button>}</div>}

  /* ──────── DUTY TAB ──────── */
  function renderDuty(){return<div className="space-y-4">
    <div className="flex gap-1.5 bg-gray-100 p-1 rounded-xl"><button onClick={function(){setDST("tasks")}} className={dutySubTab==="tasks"?"flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm":"flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-400"}>📝 待辦事項 {pendingCount>0&&<span className="text-xs bg-red-100 text-red-500 px-1.5 py-0.5 rounded-full ml-1">{pendingCount}</span>}</button><button onClick={function(){setDST("meetings")}} className={dutySubTab==="meetings"?"flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm":"flex-1 py-2.5 rounded-lg text-sm font-bold text-gray-400"}>📅 會議 {meetings.length>0&&<span className="text-xs bg-indigo-100 text-indigo-500 px-1.5 py-0.5 rounded-full ml-1">{meetings.length}</span>}</button></div>
    {dutySubTab==="tasks"&&renderDutyTasks()}
    {dutySubTab==="meetings"&&renderMeetings()}
  </div>}

  /* ★ 修正：Deadline + 優先級改為上下排列，手機唔再錯位 */
  function renderDutyTasks(){return<div className="space-y-3 fadeIn">
    <SectionHeader icon="📝" title="待辦事項" count={pendingCount} action={function(){resetDF();setSDF(!showDF)}} actionLabel={showDF?"收起":"新增"}/>
    {showDF&&<div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-indigo-200 space-y-3 fadeIn">
      <input value={dfTitle} onChange={function(e){setDFT(e.target.value)}} placeholder="任務標題..." className={IC} autoFocus/>
      <textarea value={dfDesc} onChange={function(e){setDFD(e.target.value)}} placeholder="描述（選填）..." rows={2} className={IC}/>
      <div><label className="text-xs font-bold text-gray-500 mb-1 block">⏰ Deadline</label><input type="date" value={dfDL} onChange={function(e){setDFDL(e.target.value)}} className={IC}/></div>
      <div><label className="text-xs font-bold text-gray-500 mb-1 block">🔥 優先級</label><div className="flex gap-2">{["red","orange","green"].map(function(p){return<button key={p} onClick={function(){setDFP(p)}} className={"flex-1 py-3 rounded-xl text-sm font-bold border-2 transition-all "+(dfPri===p?PRI[p].bg+" "+PRI[p].bd+" ring-2 "+PRI[p].ring:"bg-gray-50 border-gray-200 text-gray-400")}>{PRI[p].l}</button>})}</div></div>
      <div className="flex gap-2"><button onClick={addDuty} className={"flex-1 "+BTN}>{dfEditId?"✓ 儲存":"+ 新增"}</button><button onClick={resetDF} className={BTN2}>取消</button></div>
    </div>}
    <div className="flex gap-1.5 overflow-x-auto hideScroll">{[{k:"pending",l:"⏳ 進行中"},{k:"all",l:"全部"},{k:"completed",l:"✅ 已完成"}].map(function(f){return<button key={f.k} onClick={function(){setDFilter(f.k)}} className={dutyFilter===f.k?"px-3.5 py-2 rounded-lg text-xs font-bold bg-white text-indigo-600 shadow-sm border border-indigo-200":"px-3.5 py-2 rounded-lg text-xs font-bold bg-gray-50 text-gray-400 border border-gray-200"}>{f.l}</button>})}</div>
    {fDuties.length===0?<Empty icon={dutyFilter==="completed"?"✅":"📝"} title={dutyFilter==="completed"?"未有已完成嘅任務":"全部完成！做得好 🎉"} sub={dutyFilter==="pending"?"撳「新增」開始加任務":null}/>:
    <div className="space-y-2.5">{fDuties.map(function(d){var pri=PRI[d.priority];return<div key={d.id} className={"bg-white rounded-2xl shadow-sm border-2 overflow-hidden transition-all fadeIn "+(d.completed?"opacity-60 border-gray-100":pri.bd)}>
      <div className="flex">
        <div className={"w-1.5 shrink-0 "+(d.completed?"bg-gray-300":pri.bar)}/>
        <div className="flex-1 p-3.5">
          <div className="flex items-start gap-3">
            <button onClick={function(){toggleDuty(d.id)}} className={"w-7 h-7 rounded-lg border-2 flex items-center justify-center shrink-0 mt-0.5 transition-all "+(d.completed?"bg-emerald-400 border-emerald-400 text-white":"border-gray-300 hover:border-indigo-400")}>{d.completed&&"✓"}</button>
            <div className="flex-1 min-w-0">
              <div className={"text-sm font-bold mb-0.5 "+(d.completed?"text-gray-400 line-through":"text-gray-800")}>{d.title}</div>
              {d.desc&&<div className={"text-xs mb-1.5 line-clamp-2 "+(d.completed?"text-gray-300":"text-gray-500")}>{d.desc}</div>}
              <div className="flex items-center gap-2 flex-wrap">
                <span className={"text-xs font-bold px-2 py-0.5 rounded-full "+pri.badge}>{pri.l}</span>
                {d.deadline&&<DLBadge dl={d.deadline}/>}
              </div>
            </div>
            <div className="flex flex-col gap-1 shrink-0">
              <button onClick={function(){editDuty(d)}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400 hover:bg-indigo-50 hover:text-indigo-500">✏️</button>
              <button onClick={function(){setCD({fn:function(){delDuty(d.id)},title:"刪除任務？",msg:d.title})}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400 hover:bg-red-50 hover:text-red-500">🗑</button>
            </div>
          </div>
        </div>
      </div>
    </div>})}</div>}
  </div>}

  function renderMeetings(){var td=todayStr();return<div className="space-y-3 fadeIn">
    <SectionHeader icon="📅" title="會議時間表" count={meetings.length} action={function(){resetMF();setSMF(!showMF)}} actionLabel={showMF?"收起":"新增"}/>
    {showMF&&<div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-indigo-200 space-y-3 fadeIn">
      <input value={mfTitle} onChange={function(e){setMFT(e.target.value)}} placeholder="會議主題..." className={IC} autoFocus/>
      <div className="grid grid-cols-2 gap-3">
        <div><label className="text-xs font-bold text-gray-500 mb-1 block">📅 日期</label><input type="date" value={mfDate} onChange={function(e){setMFD(e.target.value)}} className={IC}/></div>
        <div><label className="text-xs font-bold text-gray-500 mb-1 block">🕐 時間</label><input type="time" value={mfTime} onChange={function(e){setMFTm(e.target.value)}} className={IC}/></div>
      </div>
      <div><label className="text-xs font-bold text-gray-500 mb-1 block">📎 附件（PDF / 相片）</label><input ref={meetRef} type="file" accept="image/*,application/pdf" multiple onChange={onMeetFile} className="hidden"/><UploadBtn inputRef={meetRef} uploading={uploading} label="📎 選擇檔案"/><FileThumb files={mfFiles} onView={function(f){setPF(f)}} onRemove={function(fid){deleteDriveFile(fid);setMFF(function(p){return p.filter(function(f){return(f.id||f.driveFileId)!==fid})})}}/></div>
      <div className="flex gap-2"><button onClick={addMeet} className={"flex-1 "+BTN}>{mfEditId?"✓ 儲存":"+ 新增會議"}</button><button onClick={resetMF} className={BTN2}>取消</button></div>
    </div>}
    {sMeetings.length===0?<Empty icon="📅" title="未有會議" sub="撳「新增」加入會議安排"/>:
    <div className="space-y-2.5">{sMeetings.map(function(m){var isPast=m.date&&m.date<td;var isToday=m.date===td;return<div key={m.id} className={"bg-white rounded-2xl shadow-sm border-2 overflow-hidden fadeIn "+(isPast?"border-gray-100 opacity-60":isToday?"border-amber-300":"border-gray-200")}>
      <div className="p-4">
        <div className="flex items-start justify-between gap-3">
          <div className="flex-1 min-w-0">
            {isToday&&<span className="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-600 border border-amber-200 mb-2 inline-block">⭐ 今日</span>}
            {isPast&&<span className="text-xs font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-400 mb-2 inline-block">已過</span>}
            <div className="text-base font-black text-gray-800 mb-1">{m.title}</div>
            <div className="flex items-center gap-3 flex-wrap">
              {m.date&&<div className="flex items-center gap-1.5"><span className="text-sm">📅</span><span className="text-sm font-bold text-indigo-600">{fmtDate(m.date)}</span></div>}
              {m.time&&<div className="flex items-center gap-1.5"><span className="text-sm">🕐</span><span className="text-sm font-bold text-violet-600">{fmtTime(m.time)}</span></div>}
            </div>
            <FileThumb files={m.files} onView={function(f){setPF(f)}}/>
          </div>
          <div className="flex flex-col gap-1 shrink-0">
            <button onClick={function(){editMeet(m)}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">✏️</button>
            <button onClick={function(){setCD({fn:function(){delMeet(m.id)},title:"刪除會議？",msg:m.title})}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">🗑</button>
          </div>
        </div>
      </div>
    </div>})}</div>}
  </div>}

  /* ──────── IT TAB ──────── */
  function renderIT(){return<div className="space-y-3 fadeIn">
    <SectionHeader icon="💻" title="IT · PictureWorks" count={itPending} action={function(){resetIF();setSIF(!showIF)}} actionLabel={showIF?"收起":"新增"}/>
    {showIF&&<div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-cyan-200 space-y-3 fadeIn">
      <input value={ifTitle} onChange={function(e){setIFT(e.target.value)}} placeholder="事項標題..." className={IC} autoFocus/>
      <textarea value={ifDesc} onChange={function(e){setIFD(e.target.value)}} placeholder="詳細描述（選填）..." rows={2} className={IC}/>
      <div><label className="text-xs font-bold text-gray-500 mb-1 block">⏰ Deadline</label><input type="date" value={ifDL} onChange={function(e){setIFDL(e.target.value)}} className={IC}/></div>
      <div className="flex gap-2"><button onClick={addIt} className={"flex-1 "+BTN}>{ifEditId?"✓ 儲存":"+ 新增"}</button><button onClick={resetIF} className={BTN2}>取消</button></div>
    </div>}
    <div className="flex gap-1.5 overflow-x-auto hideScroll">{[{k:"pending",l:"⏳ 進行中"},{k:"all",l:"全部"},{k:"completed",l:"✅ 已完成"}].map(function(f){return<button key={f.k} onClick={function(){setITF(f.k)}} className={itFilter===f.k?"px-3.5 py-2 rounded-lg text-xs font-bold bg-white text-cyan-600 shadow-sm border border-cyan-200":"px-3.5 py-2 rounded-lg text-xs font-bold bg-gray-50 text-gray-400 border border-gray-200"}>{f.l}</button>})}</div>
    {fIt.length===0?<Empty icon="💻" title={itFilter==="completed"?"未有已完成項目":"全部搞掂！🎉"}/>:
    <div className="space-y-2.5">{fIt.map(function(i){var dlI=deadlineInfo(i.deadline);return<div key={i.id} className={"bg-white rounded-2xl shadow-sm border-2 overflow-hidden fadeIn "+(i.completed?"border-gray-100 opacity-60":"border-cyan-200")}>
      <div className="flex">
        <div className={"w-1.5 shrink-0 "+(i.completed?"bg-gray-300":dlI&&dlI.urgent?"bg-red-400":"bg-cyan-400")}/>
        <div className="flex-1 p-3.5">
          <div className="flex items-start gap-3">
            <button onClick={function(){toggleIt(i.id)}} className={"w-7 h-7 rounded-lg border-2 flex items-center justify-center shrink-0 mt-0.5 transition-all "+(i.completed?"bg-emerald-400 border-emerald-400 text-white":"border-gray-300 hover:border-cyan-400")}>{i.completed&&"✓"}</button>
            <div className="flex-1 min-w-0">
              <div className={"text-sm font-bold mb-0.5 "+(i.completed?"text-gray-400 line-through":"text-gray-800")}>{i.title}</div>
              {i.desc&&<div className={"text-xs mb-1.5 line-clamp-2 "+(i.completed?"text-gray-300":"text-gray-500")}>{i.desc}</div>}
              {i.deadline&&<DLBadge dl={i.deadline}/>}
            </div>
            <div className="flex flex-col gap-1 shrink-0">
              <button onClick={function(){editIt(i)}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">✏️</button>
              <button onClick={function(){setCD({fn:function(){delIt(i.id)},title:"刪除？",msg:i.title})}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">🗑</button>
            </div>
          </div>
        </div>
      </div>
    </div>})}</div>}
  </div>}

  /* ──────── STAFF TAB ──────── */
  function renderStaff(){return<div className="space-y-4 fadeIn">
    <SectionHeader icon="👥" title="同事管理"/>
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
      <div className="flex gap-2 mb-3"><input value={newSN} onChange={function(e){setNSN(e.target.value)}} placeholder="新同事名..." className={"flex-1 "+IC} onKeyDown={function(e){if(e.key==="Enter")addStaff2()}}/><button onClick={addStaff2} className="bg-gradient-to-r from-indigo-500 to-violet-500 text-white font-bold px-4 rounded-xl shadow-sm">+ 加</button></div>
      {staffList.length===0?<div className="text-sm text-gray-300 text-center py-3">未有同事，請先加入名單</div>:
      <div className="flex gap-2 overflow-x-auto hideScroll pb-1">{staffList.map(function(n){var cnt=(staffIssues[n]||[]).length;return<div key={n} className="relative shrink-0"><button onClick={function(){setSS(n);setSSIF(false);setSIE(null)}} className={selStaff===n?"px-4 py-2.5 rounded-xl text-sm font-bold bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-sm":"px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 text-gray-600 border border-gray-200"}>{n}{cnt>0&&<span className={"ml-1 text-xs px-1.5 py-0.5 rounded-full "+(selStaff===n?"bg-white bg-opacity-30":"bg-red-100 text-red-500")}>{cnt}</span>}</button><button onClick={function(){setCD({fn:function(){rmStaff(n)},title:"移除同事？",msg:"將會刪除「"+n+"」及其所有記錄"})}} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-400 text-white text-xs flex items-center justify-center shadow">✕</button></div>})}</div>}
    </div>

    {selStaff&&<div className="space-y-3">
      <SectionHeader icon="📋" title={selStaff+" 嘅記錄"} count={curIssues.length} action={function(){resetSIF();setSSIF(!showSIF)}} actionLabel={showSIF?"收起":"新增"}/>
      {showSIF&&<div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-violet-200 space-y-3 fadeIn">
        <input value={siTitle} onChange={function(e){setSIT(e.target.value)}} placeholder="問題 / 事項標題..." className={IC} autoFocus/>
        <textarea value={siDesc} onChange={function(e){setSID(e.target.value)}} placeholder="詳細描述（選填）..." rows={2} className={IC}/>
        <div><label className="text-xs font-bold text-gray-500 mb-1 block">📅 日期</label><input type="date" value={siDate} onChange={function(e){setSIDate(e.target.value)}} className={IC}/></div>
        <div><label className="text-xs font-bold text-gray-500 mb-1 block">📎 附件（PDF / 相片）</label><input ref={siRef} type="file" accept="image/*,application/pdf" multiple onChange={onSIFile} className="hidden"/><UploadBtn inputRef={siRef} uploading={uploading} label="📎 選擇檔案"/><FileThumb files={siFiles} onView={function(f){setPF(f)}} onRemove={function(fid){deleteDriveFile(fid);setSIFiles(function(p){return p.filter(function(f){return(f.id||f.driveFileId)!==fid})})}}/></div>
        <div className="flex gap-2"><button onClick={addIssue} className={"flex-1 "+BTN}>{siEditId?"✓ 儲存":"+ 新增"}</button><button onClick={resetSIF} className={BTN2}>取消</button></div>
      </div>}
      {curIssues.length===0?<Empty icon="📝" title={"「"+selStaff+"」未有記錄"} sub="撳「新增」開始記錄"/>:
      <div className="space-y-2.5">{curIssues.map(function(iss){return<div key={iss.id} className="bg-white rounded-2xl shadow-sm border-2 border-gray-200 overflow-hidden fadeIn">
        <div className="p-4">
          <div className="flex items-start justify-between gap-3">
            <div className="flex-1 min-w-0">
              <div className="text-sm font-black text-gray-800 mb-1">{iss.title}</div>
              {iss.desc&&<div className="text-xs text-gray-500 mb-2 whitespace-pre-wrap">{iss.desc}</div>}
              {iss.date&&<div className="flex items-center gap-1.5 mb-1"><span className="text-xs">📅</span><span className="text-xs font-bold text-violet-600">{fmtDate(iss.date)}</span></div>}
              <FileThumb files={iss.files} onView={function(f){setPF(f)}}/>
            </div>
            <div className="flex flex-col gap-1 shrink-0">
              <button onClick={function(){editIssue(iss)}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">✏️</button>
              <button onClick={function(){setCD({fn:function(){delIssue(selStaff,iss.id)},title:"刪除記錄？",msg:iss.title})}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">🗑</button>
            </div>
          </div>
        </div>
      </div>})}</div>}
    </div>}
  </div>}

  /* ──────── NOTES TAB ──────── */
  function renderNotes(){return<div className="space-y-3 fadeIn">
    <SectionHeader icon="📌" title="公司需知" count={notes.length} action={function(){resetNF();setSNF(!showNF)}} actionLabel={showNF?"收起":"新增"}/>
    {showNF&&<div className="bg-white rounded-2xl p-4 shadow-sm border-2 border-amber-200 space-y-3 fadeIn">
      <input value={nfTitle} onChange={function(e){setNFT(e.target.value)}} placeholder="標題..." className={IC} autoFocus/>
      <textarea value={nfContent} onChange={function(e){setNFC(e.target.value)}} placeholder="內容..." rows={4} className={IC}/>
      <div className="flex gap-2"><button onClick={addNote2} className={"flex-1 "+BTN}>{nfEditId?"✓ 儲存":"+ 新增"}</button><button onClick={resetNF} className={BTN2}>取消</button></div>
    </div>}
    {notes.length>0&&<div className="text-xs text-gray-400 bg-amber-50 rounded-xl px-3 py-2 border border-amber-200 flex items-center gap-1.5">💡 用 ↑↓ 改排序 · 人手調整先後次序</div>}
    {notes.length===0?<Empty icon="📌" title="未有公司需知" sub="撳「新增」記錄重要事項"/>:
    <div className="space-y-2.5">{notes.map(function(n,idx){var isExp=!!expandedNote[n.id];var isLong=n.content&&n.content.length>120;return<div key={n.id} className="bg-white rounded-2xl shadow-sm border-2 border-amber-200 overflow-hidden fadeIn">
      <div className="p-4">
        <div className="flex items-start gap-3">
          <div className="flex flex-col gap-1 shrink-0 mt-0.5">
            <button onClick={function(){moveNote(n.id,-1)}} disabled={idx===0} className={"w-8 h-8 rounded-lg flex items-center justify-center text-sm transition-colors "+(idx===0?"bg-gray-50 text-gray-200":"bg-amber-50 text-amber-500 hover:bg-amber-100")}>↑</button>
            <div className="text-center text-xs font-black text-amber-400">{idx+1}</div>
            <button onClick={function(){moveNote(n.id,1)}} disabled={idx===notes.length-1} className={"w-8 h-8 rounded-lg flex items-center justify-center text-sm transition-colors "+(idx===notes.length-1?"bg-gray-50 text-gray-200":"bg-amber-50 text-amber-500 hover:bg-amber-100")}>↓</button>
          </div>
          <div className="flex-1 min-w-0">
            <div className="text-sm font-black text-gray-800 mb-1.5">📌 {n.title}</div>
            {n.content&&<div className={"text-sm text-gray-600 whitespace-pre-wrap leading-relaxed "+(isLong&&!isExp?"line-clamp-2":"")}>{n.content}</div>}
            {isLong&&<button onClick={function(){setEN(function(p){var x=Object.assign({},p);x[n.id]=!x[n.id];return x})}} className="text-xs font-bold text-indigo-500 mt-1.5">{isExp?"收起 ▲":"展開全部 ▼"}</button>}
          </div>
          <div className="flex flex-col gap-1 shrink-0">
            <button onClick={function(){editNote2(n)}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">✏️</button>
            <button onClick={function(){setCD({fn:function(){delNote(n.id)},title:"刪除需知？",msg:n.title})}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">🗑</button>
          </div>
        </div>
      </div>
    </div>})}</div>}
  </div>}

  /* ═══ SYNC INDICATOR ═══ */
  function renderSync(){
    if(syncing)return<div className="flex items-center gap-1.5"><div className="w-3 h-3 border-2 border-white border-t-transparent rounded-full spin"/><span className="text-xs opacity-80">同步中…</span></div>;
    if(lastSaved)return<div className="flex items-center gap-1.5"><span className="text-xs opacity-50">✓ 已儲存 {lastSaved.getHours()+":"+String(lastSaved.getMinutes()).padStart(2,"0")}</span></div>;
    return null;
  }

  /* ═══ MAIN RETURN ═══ */
  return<div className="min-h-screen bg-gray-50 pb-8">
    <div className="px-5 pt-6 pb-8 text-white relative overflow-hidden" style={{background:"linear-gradient(135deg,#818cf8,#6366f1,#7c3aed)"}}>
      <div className="absolute top-0 right-0 w-40 h-40 bg-white opacity-10 rounded-full" style={{transform:"translate(30px,-30px)"}}/>
      <div className="absolute bottom-0 left-0 w-24 h-24 bg-white opacity-5 rounded-full" style={{transform:"translate(-10px,10px)"}}/>
      <div className="relative max-w-2xl mx-auto">
        <div className="text-xs opacity-70 tracking-wider mb-1">📋 WORK MANAGEMENT</div>
        <div className="text-xl font-extrabold">Work Dashboard</div>
        <div className="flex items-center justify-between">
          <div className="text-xs opacity-50">備忘錄 · 任務管理 · 會議紀錄</div>
          {renderSync()}
        </div>
      </div>
    </div>

    <div className="sticky top-0 z-40 bg-white border-b border-gray-200 overflow-x-auto hideScroll shadow-sm">
      <div className="flex gap-1 px-3 py-2" style={{minWidth:"max-content"}}>
        {TABS.map(function(t){return<button key={t.id} onClick={function(){setTab(t.id)}} className={tab===t.id?"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow":"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap text-gray-500 hover:bg-gray-100"}>
          {t.icon} {t.label}
          {t.count>0&&<span className={"ml-1 text-xs px-1.5 py-0.5 rounded-full "+(tab===t.id?"bg-white bg-opacity-30":"bg-gray-200 text-gray-500")}>{t.count}</span>}
        </button>})}
      </div>
    </div>

    <div className="max-w-4xl mx-auto px-4 py-5">
      {tab==="duty"&&renderDuty()}
      {tab==="it"&&renderIT()}
      {tab==="staff"&&renderStaff()}
      {tab==="notes"&&renderNotes()}
    </div>

    <FileModal file={previewFile} onClose={function(){setPF(null)}}/>
    <ConfirmModal show={!!confirmDel} title={confirmDel?confirmDel.title:""} msg={confirmDel?confirmDel.msg:""} onYes={function(){if(confirmDel)confirmDel.fn();setCD(null)}} onNo={function(){setCD(null)}}/>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
