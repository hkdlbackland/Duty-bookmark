<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Work Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <style>
    html{overflow-x:hidden;height:100%;overscroll-behavior:none}
    body{margin:0;overflow-x:hidden;height:100%;overscroll-behavior:none;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      -webkit-tap-highlight-color:transparent;-webkit-overflow-scrolling:touch}
    .hideScroll::-webkit-scrollbar{display:none}
    .hideScroll{-ms-overflow-style:none;scrollbar-width:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .fadeIn{animation:fadeIn .25s ease-out}
    @keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
    .pulse2{animation:pulse2 1.5s infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin .8s linear infinite}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    /* ★ 修改④a：手機版日曆顯示 dots ★ */
    @media(max-width:640px){.cal-tags{display:none!important}.cal-dots-m{display:flex!important}}
    input[type="date"],input[type="time"]{min-height:44px}
    .hdr-bg{background:linear-gradient(135deg,#818cf8,#6366f1,#7c3aed)}
    .hdr-circle{pointer-events:none}
    @keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
    .popIn{animation:popIn .2s ease-out}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
var{useState,useRef,useMemo,useEffect,useCallback}=React;

var API_URL="https://script.google.com/macros/s/AKfycbyZrP3PBIJvZaG9PJwO58uctQAbp6FYN8NOAtqFe1Q9csfeVDj5XVf0DylKo8jIRNzRdQ/exec";

async function apiGet(){try{var r=await fetch(API_URL+"?t="+Date.now());var t=await r.text();return JSON.parse(t)}catch(e){console.error("GET err:",e);return{success:false,error:e.message}}}
async function apiPost(data){try{var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});var t=await r.text();return JSON.parse(t)}catch(e){console.error("POST err:",e);return{success:false,error:e.message}}}
async function uploadFileToDrive(file){var dataUrl=await new Promise(function(res){var r=new FileReader();r.onload=function(e){res(e.target.result)};r.readAsDataURL(file)});var base64=dataUrl.split(",")[1];var resp=await apiPost({action:"uploadFile",fileName:file.name,mimeType:file.type,base64Data:base64});if(resp&&resp.success)return{id:resp.data.driveFileId,name:resp.data.name,type:resp.data.type,driveFileId:resp.data.driveFileId,viewUrl:resp.data.viewUrl,downloadUrl:resp.data.downloadUrl,isImg:resp.data.isImg,isPdf:resp.data.isPdf};return null}
function deleteDriveFile(fid){apiPost({action:"deleteFile",driveFileId:fid})}
function deleteDriveFiles(files){if(files&&files.length)files.forEach(function(f){deleteDriveFile(f.driveFileId||f.id)})}

function gid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,6)}
function fmtDate(s){if(!s)return"";var d=new Date(s);var wd=["日","一","二","三","四","五","六"];return(d.getMonth()+1)+"月"+d.getDate()+"日（"+wd[d.getDay()]+"）"}
function fmtDateShort(s){if(!s)return"";var d=new Date(s);return(d.getMonth()+1)+"/"+d.getDate()}
function fmtTime(s){if(!s)return"";var p=s.split(":");return p[0]+":"+p[1]}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
/* ★ 修改①：加 normDate helper，統一日期格式 ★ */
function normDate(s){if(!s)return"";return String(s).substring(0,10)}
function toDS(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function diffDays(dl){if(!dl)return null;var now=new Date();now.setHours(0,0,0,0);var d=new Date(dl);d.setHours(0,0,0,0);return Math.ceil((d-now)/(864e5))}
/* ★ 修改②：deadlineInfo 加實際日期 ★ */
function deadlineInfo(dl){if(!dl)return null;var diff=diffDays(dl);var ds=fmtDate(dl);if(diff<0)return{t:ds+"（已過期"+Math.abs(diff)+"日）",c:"bg-red-100 text-red-600 border-red-200",ic:"🔴",urgent:true};if(diff===0)return{t:ds+"（今日到期）",c:"bg-orange-100 text-orange-600 border-orange-200",ic:"🟠",urgent:true};if(diff<=3)return{t:ds+"（"+diff+"日後到期）",c:"bg-amber-100 text-amber-600 border-amber-200",ic:"🟡",urgent:false};return{t:ds+"（"+diff+"日後）",c:"bg-emerald-100 text-emerald-600 border-emerald-200",ic:"🟢",urgent:false}}
function curQuarter(){var m=new Date().getMonth();return m<3?"Q1":m<6?"Q2":m<9?"Q3":"Q4"}
function curYear(){return new Date().getFullYear()}
function qLabel(q,y){return y+" "+q}

var PRI={red:{l:"緊急",bg:"bg-red-50",bd:"border-red-300",bar:"bg-red-400",badge:"bg-red-100 text-red-600",ring:"ring-red-200"},orange:{l:"一般",bg:"bg-orange-50",bd:"border-orange-300",bar:"bg-orange-400",badge:"bg-orange-100 text-orange-600",ring:"ring-orange-200"},green:{l:"低",bg:"bg-emerald-50",bd:"border-emerald-300",bar:"bg-emerald-400",badge:"bg-emerald-100 text-emerald-600",ring:"ring-emerald-200"}};
var IC="w-full border-2 border-gray-200 rounded-xl px-4 py-3 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-300";
var BTN="bg-gradient-to-r from-indigo-500 to-violet-500 text-white font-bold px-5 py-3 rounded-xl shadow-sm active:scale-95 transition-transform";
var BTN2="bg-gray-100 text-gray-500 font-bold px-4 py-3 rounded-xl";
var TAG_COLORS={meet:{bg:"#fef3c7",color:"#92400e",dot:"#f59e0b"},duty:{bg:"#e0e7ff",color:"#4338ca",dot:"#6366f1"},it:{bg:"#cffafe",color:"#0e7490",dot:"#06b6d4"}};
var MAX_TAGS=3;
var Q_COLORS={Q1:{bg:"bg-sky-50",bd:"border-sky-300",badge:"bg-sky-100 text-sky-600",bar:"bg-sky-400",icon:"❄️",label:"1月 - 3月"},Q2:{bg:"bg-emerald-50",bd:"border-emerald-300",badge:"bg-emerald-100 text-emerald-600",bar:"bg-emerald-400",icon:"🌸",label:"4月 - 6月"},Q3:{bg:"bg-amber-50",bd:"border-amber-300",badge:"bg-amber-100 text-amber-600",bar:"bg-amber-400",icon:"☀️",label:"7月 - 9月"},Q4:{bg:"bg-orange-50",bd:"border-orange-300",badge:"bg-orange-100 text-orange-600",bar:"bg-orange-400",icon:"🍂",label:"10月 - 12月"}};

function Empty({icon,title,sub}){return<div className="bg-white rounded-2xl p-10 text-center border-2 border-dashed border-gray-200 fadeIn"><div className="text-5xl mb-3">{icon||"📭"}</div><div className="text-base font-bold text-gray-400 mb-1">{title||"未有資料"}</div>{sub&&<div className="text-sm text-gray-300">{sub}</div>}</div>}
function DLBadge({dl}){var info=deadlineInfo(dl);if(!info)return null;return<span className={"inline-flex items-center gap-1 text-xs font-bold px-2 py-0.5 rounded-full border "+info.c}>{info.ic} {info.t}</span>}
function ClearDate({value,onChange,cls}){return<div className="flex gap-2 items-center"><input type="date" value={value} onChange={function(e){onChange(e.target.value)}} className={(cls||IC)+" flex-1"}/>{value&&<button type="button" onClick={function(){onChange("")}} className="shrink-0 w-10 h-10 rounded-xl bg-gray-100 text-gray-400 flex items-center justify-center text-sm hover:bg-red-50 hover:text-red-400 active:scale-95 transition-all">✕</button>}</div>}
function FileThumb({files,onView,onRemove}){if(!files||files.length===0)return null;return<div className="flex gap-2 flex-wrap mt-2.5">{files.map(function(f){return<div key={f.id||f.driveFileId} className="relative group"><button onClick={function(){onView(f)}} className="w-16 h-16 rounded-xl border-2 border-gray-200 overflow-hidden bg-gray-50 flex items-center justify-center hover:border-indigo-300 active:scale-95 transition-all">{f.isImg?<img src={f.viewUrl} className="w-full h-full object-cover" onError={function(e){e.target.style.display="none"}}/>:<div className="flex flex-col items-center"><span className="text-2xl">📄</span><span className="text-gray-400 truncate w-14 text-center" style={{fontSize:7}}>{f.name}</span></div>}</button>{onRemove&&<button onClick={function(){onRemove(f.id||f.driveFileId)}} className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-400 text-white text-xs flex items-center justify-center shadow">✕</button>}</div>})}</div>}
function FileModal({file,onClose}){if(!file)return null;return<div className="fixed inset-0 bg-black bg-opacity-85 z-50 flex items-center justify-center p-4" onClick={onClose}><div className="relative w-full max-w-3xl" onClick={function(e){e.stopPropagation()}}><button onClick={onClose} className="absolute -top-12 right-0 w-10 h-10 rounded-full bg-white bg-opacity-20 text-white text-xl flex items-center justify-center">✕</button>{file.isImg?<img src={file.viewUrl} className="w-full max-h-screen object-contain rounded-xl"/>:<div className="bg-white rounded-2xl p-8 text-center"><div className="text-6xl mb-4">📄</div><div className="text-base font-bold text-gray-700 mb-2">{file.name}</div><a href={file.viewUrl} target="_blank" rel="noopener noreferrer" className={"inline-block "+BTN}>📂 打開檔案</a>{file.downloadUrl&&<div className="mt-3"><a href={file.downloadUrl} target="_blank" rel="noopener noreferrer" className="text-sm font-bold text-indigo-500">📥 下載</a></div>}<p className="text-xs text-gray-400 mt-4">會喺新分頁開啟 Google Drive</p></div>}</div></div>}
function ConfirmModal({show,title,msg,onYes,onNo}){if(!show)return null;return<div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-end sm:items-center justify-center p-4" onClick={onNo}><div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl fadeIn" onClick={function(e){e.stopPropagation()}}><div className="text-center mb-5"><div className="text-3xl mb-2">⚠️</div><div className="text-base font-black text-gray-700">{title||"確認刪除？"}</div>{msg&&<div className="text-sm text-gray-400 mt-1">{msg}</div>}</div><div className="flex gap-3"><button onClick={onNo} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100">取消</button><button onClick={onYes} className="flex-1 py-3 rounded-xl font-bold text-white bg-red-500 shadow-sm">確認刪除</button></div></div></div>}
function SectionHeader({icon,title,count,action,actionLabel,actionIcon}){return<div className="flex items-center justify-between mb-3"><div className="flex items-center gap-2"><span className="text-xl">{icon}</span><span className="text-base font-black text-gray-700">{title}</span>{count!=null&&count>0&&<span className="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-600">{count}</span>}</div>{action&&<button onClick={action} className="flex items-center gap-1.5 text-sm font-bold text-indigo-500 bg-indigo-50 px-3.5 py-2 rounded-xl border border-indigo-200 active:scale-95 transition-transform"><span>{actionIcon||"+"}</span><span>{actionLabel||"新增"}</span></button>}</div>}
function UploadBtn({inputRef,uploading,label}){return<div>{uploading?<div className="w-full py-3 rounded-xl border-2 border-dashed border-indigo-200 text-sm font-bold text-indigo-400 flex items-center justify-center gap-2"><div className="w-4 h-4 border-2 border-indigo-400 border-t-transparent rounded-full spin"/>上傳中...</div>:<button onClick={function(){inputRef.current.click()}} className="w-full py-3 rounded-xl border-2 border-dashed border-indigo-200 text-sm font-bold text-indigo-400 hover:bg-indigo-50 transition-colors">{label||"📎 選擇檔案"}</button>}</div>}

/* ═══════════ CALENDAR ═══════════ */
function Calendar({duties,itItems,meetings,onToggleDuty,onToggleIt,onEditDuty,onEditIt,onEditMeet}){
  var now=new Date();
  var[viewY,setVY]=useState(now.getFullYear());
  var[viewM,setVM]=useState(now.getMonth());
  var[selDay,setSD]=useState(null);
  var td=todayStr();
  var WDAYS=["一","二","三","四","五","六","日"];

  var calMap=useMemo(function(){
    var map={};
    function ensureKey(k){if(!map[k])map[k]={duties:[],it:[],meetings:[]}}
    /* ★ 修改③：用 normDate 統一日期格式做 key ★ */
    duties.filter(function(d){return!d.completed&&d.deadline}).forEach(function(d){var k=normDate(d.deadline);ensureKey(k);map[k].duties.push(d)});
    itItems.filter(function(i){return!i.completed&&i.deadline}).forEach(function(i){var k=normDate(i.deadline);ensureKey(k);map[k].it.push(i)});
    meetings.forEach(function(m){if(!m.date)return;var k=normDate(m.date);ensureKey(k);map[k].meetings.push(m)});
    return map;
  },[duties,itItems,meetings]);

  var cells=useMemo(function(){
    var first=new Date(viewY,viewM,1);var startDow=(first.getDay()+6)%7;
    var daysInMonth=new Date(viewY,viewM+1,0).getDate();
    var arr=[];for(var i=0;i<startDow;i++)arr.push(null);
    for(var d=1;d<=daysInMonth;d++)arr.push(d);
    while(arr.length%7!==0)arr.push(null);return arr;
  },[viewY,viewM]);

  function prev(){if(viewM===0){setVM(11);setVY(viewY-1)}else setVM(viewM-1);setSD(null)}
  function next(){if(viewM===11){setVM(0);setVY(viewY+1)}else setVM(viewM+1);setSD(null)}
  function goToday(){setVY(now.getFullYear());setVM(now.getMonth());setSD(null)}
  var mLabel=(viewM+1)+"月 "+viewY;

  function buildTags(data){
    if(!data)return[];var tags=[];
    var priOrder={red:0,orange:1,green:2};
    data.meetings.slice().sort(function(a,b){return(a.time||"").localeCompare(b.time||"")}).forEach(function(m){tags.push({type:"meet",label:(m.time?fmtTime(m.time)+" ":"")+m.title})});
    data.duties.slice().sort(function(a,b){return priOrder[a.priority]-priOrder[b.priority]}).forEach(function(d){tags.push({type:"duty",label:d.title})});
    data.it.forEach(function(i){tags.push({type:"it",label:i.title})});
    return tags;
  }

  var selData=selDay?calMap[selDay]:null;
  var hasSelData=selData&&(selData.duties.length>0||selData.it.length>0||selData.meetings.length>0);

  return<div className="bg-white rounded-2xl shadow-sm border-2 border-indigo-200 overflow-hidden fadeIn">
    <div className="flex items-center justify-between px-4 py-3 bg-gradient-to-r from-indigo-50 to-violet-50 border-b border-indigo-100">
      <button onClick={prev} className="w-9 h-9 rounded-xl bg-white flex items-center justify-center text-indigo-500 font-bold shadow-sm active:scale-90 transition-transform border border-indigo-200">◀</button>
      <div className="text-center"><div className="text-base font-black text-gray-800">{mLabel}</div>{(viewY!==now.getFullYear()||viewM!==now.getMonth())&&<button onClick={goToday} className="text-xs font-bold text-indigo-500 mt-0.5">↩ 返回今月</button>}</div>
      <button onClick={next} className="w-9 h-9 rounded-xl bg-white flex items-center justify-center text-indigo-500 font-bold shadow-sm active:scale-90 transition-transform border border-indigo-200">▶</button>
    </div>
    <div className="grid grid-cols-7 border-b border-gray-100">{WDAYS.map(function(w){return<div key={w} className="text-center py-2 text-xs font-bold text-gray-400">{w}</div>})}</div>
    <div className="grid grid-cols-7 gap-px bg-gray-100 p-px">
      {cells.map(function(day,idx){
        if(day===null)return<div key={"e"+idx} className="bg-white" style={{minHeight:78}}/>;
        var ds=toDS(viewY,viewM,day);var isToday=ds===td;var isSel=ds===selDay;
        var data=calMap[ds];var tags=buildTags(data);var totalCount=tags.length;
        var showTags=tags.slice(0,MAX_TAGS);var moreCount=totalCount-MAX_TAGS;
        return<div key={ds} onClick={function(){if(selDay===ds)setSD(null);else setSD(ds)}} className={"bg-white flex flex-col py-1 px-0.5 cursor-pointer transition-all active:scale-95 overflow-hidden "+(isSel?"ring-2 ring-indigo-400 ring-inset bg-indigo-50":"")} style={{minHeight:78}}>
          <div className="flex justify-center shrink-0"><span className={"text-xs font-bold leading-none flex items-center justify-center "+(isToday?"w-6 h-6 rounded-full bg-indigo-500 text-white":isSel?"text-indigo-600":"text-gray-700")}>{day}</span></div>
          {/* ★ 修改④b：桌面版文字標籤 + 手機版彩色 dots ★ */}
          {totalCount>0&&<div className="w-full mt-0.5" style={{flex:"1 1 auto"}}>
            <div className="cal-tags" style={{display:"flex",flexDirection:"column",gap:1,overflow:"hidden"}}>
              {showTags.map(function(tag,ti){var tc=TAG_COLORS[tag.type];return<div key={ti} style={{fontSize:8,lineHeight:"11px",padding:"1px 2px",borderRadius:3,background:tc.bg,color:tc.color,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",width:"100%",textAlign:"center",borderLeft:"2px solid "+tc.dot}}>{tag.label}</div>})}
              {moreCount>0&&<div style={{fontSize:7,lineHeight:"10px",color:"#9ca3af",fontWeight:700,textAlign:"center"}}>+{moreCount} 更多</div>}
            </div>
            <div className="cal-dots-m" style={{display:"none",justifyContent:"center",alignItems:"center",gap:3,flexWrap:"wrap",paddingTop:4}}>{(function(){var seen={};return tags.filter(function(t){if(seen[t.type])return false;seen[t.type]=true;return true}).map(function(t,ti){return<div key={ti} style={{width:6,height:6,borderRadius:"50%",background:TAG_COLORS[t.type].dot}}/>})})()}</div>
          </div>}
        </div>
      })}
    </div>
    <div className="flex items-center justify-center gap-4 py-2 border-t border-gray-100 bg-gray-50 flex-wrap">
      <span className="flex items-center gap-1.5 text-xs text-gray-400"><span className="w-2 h-2 rounded-full" style={{background:"#6366f1"}}/>Duty</span>
      <span className="flex items-center gap-1.5 text-xs text-gray-400"><span className="w-2 h-2 rounded-full" style={{background:"#06b6d4"}}/>IT</span>
      <span className="flex items-center gap-1.5 text-xs text-gray-400"><span className="w-2 h-2 rounded-full" style={{background:"#f59e0b"}}/>會議</span>
    </div>
    {selDay&&<div className="border-t-2 border-indigo-200 bg-gradient-to-b from-indigo-50 to-white p-4 popIn">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2"><span className="text-lg">📅</span><span className="text-sm font-black text-gray-800">{fmtDate(selDay)}</span>{selDay===td&&<span className="text-xs font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-600">今日</span>}</div>
        <button onClick={function(){setSD(null)}} className="w-7 h-7 rounded-lg bg-white flex items-center justify-center text-gray-400 border border-gray-200 text-xs">✕</button>
      </div>
      {!hasSelData&&<div className="text-center py-3"><div className="text-2xl mb-1">📭</div><div className="text-sm text-gray-400 font-bold">呢日暫時無任何事項</div></div>}
      {hasSelData&&<div className="space-y-2">
        {selData.meetings.map(function(m){return<div key={"sm"+m.id} className="flex items-center gap-2.5 bg-white rounded-xl p-3 border-2 border-amber-200"><div className="w-1 self-stretch rounded-full shrink-0 bg-amber-400"/><div className="flex-1 min-w-0"><span className="text-xs font-bold px-1.5 py-0.5 rounded bg-amber-100 text-amber-600 mb-0.5 inline-block">會議</span><div className="text-sm font-bold text-gray-800">{m.title}</div>{m.time&&<div className="text-xs font-bold text-violet-600 mt-0.5">🕐 {fmtTime(m.time)}</div>}</div><button onClick={function(){onEditMeet(m)}} className="w-7 h-7 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400 shrink-0 text-xs">✏️</button></div>})}
        {selData.duties.map(function(d){var pri=PRI[d.priority];return<div key={"sd"+d.id} className={"flex items-center gap-2.5 bg-white rounded-xl p-3 border-2 "+pri.bd}><div className={"w-1 self-stretch rounded-full shrink-0 "+pri.bar}/><div className="flex-1 min-w-0"><div className="flex items-center gap-1.5 mb-0.5"><span className="text-xs font-bold px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-600">Duty</span><span className={"text-xs font-bold px-1.5 py-0.5 rounded "+pri.badge}>{pri.l}</span></div><div className="text-sm font-bold text-gray-800">{d.title}</div>{d.desc&&<div className="text-xs text-gray-500 line-clamp-2 mt-0.5">{d.desc}</div>}</div><div className="flex flex-col gap-1 shrink-0"><button onClick={function(){onToggleDuty(d.id)}} className="w-7 h-7 rounded-lg border-2 border-gray-300 flex items-center justify-center hover:border-emerald-400 hover:bg-emerald-50 active:scale-90 transition-all text-xs">✓</button><button onClick={function(){onEditDuty(d)}} className="w-7 h-7 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400 text-xs">✏️</button></div></div>})}
        {selData.it.map(function(i){return<div key={"si"+i.id} className="flex items-center gap-2.5 bg-white rounded-xl p-3 border-2 border-cyan-200"><div className="w-1 self-stretch rounded-full shrink-0 bg-cyan-400"/><div className="flex-1 min-w-0"><span className="text-xs font-bold px-1.5 py-0.5 rounded bg-cyan-100 text-cyan-600 mb-0.5 inline-block">IT</span><div className="text-sm font-bold text-gray-800">{i.title}</div>{i.desc&&<div className="text-xs text-gray-500 line-clamp-2 mt-0.5">{i.desc}</div>}</div><div className="flex flex-col gap-1 shrink-0"><button onClick={function(){onToggleIt(i.id)}} className="w-7 h-7 rounded-lg border-2 border-gray-300 flex items-center justify-center hover:border-emerald-400 hover:bg-emerald-50 active:scale-90 transition-all text-xs">✓</button><button onClick={function(){onEditIt(i)}} className="w-7 h-7 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400 text-xs">✏️</button></div></div>})}
      </div>}
    </div>}

}

/* ═══════════ MAIN APP ═══════════ */

  }

  useEffect(function(){

  async function doUploadFiles(fileList){setUploading(true);var results=[];for(var i=0;i<fileList.length;i++){var f=await uploadFileToDrive(fileList[i]);if(f)results.push(f)}setUploading(false);return results}

  /* DUTY FN */
  function addDuty(){if(!dfTitle.trim())return;if(dfEditId){setDuties(function(p){return p.map(function(d){return d.id===dfEditId?Object.assign({},d,{title:dfTitle,desc:dfDesc,deadline:dfDL,priority:dfPri}):d})})}else{setDuties(function(p){return[{id:gid(),title:dfTitle,desc:dfDesc,deadline:dfDL,priority:dfPri,completed:false,createdAt:new Date().toISOString()}].concat(p)})}resetDF()}
  function resetDF(){setDFT("");setDFD("");setDFDL("");setDFP("green");setDFE(null);setSDF(false)}

  function delMeet(id){var m=meetings.find(function(x){return x.id===id});if(m)deleteDriveFiles(m.files);setMeetings(function(p){return p.filter(function(x){return x.id!==id})})}
  async function onMeetFile(e){var fs=await doUploadFiles(e.target.files);setMFF(function(p){return p.concat(fs)});e.target.value=""}
  var sMeetings=useMemo(function(){return meetings.slice().sort(function(a,b){var da=new Date(a.date+" "+(a.time||"00:00"));var db=new Date(b.date+" "+(b.time||"00:00"));return da-db})},[meetings]);

  /* IT FN */
  function addIt(){if(!ifTitle.trim())return;if(ifEditId){setIT(function(p){return p.map(function(i){return i.id===ifEditId?Object.assign({},i,{title:ifTitle,desc:ifDesc,deadline:ifDL}):i})})}else{setIT(function(p){return[{id:gid(),title:ifTitle,desc:ifDesc,deadline:ifDL,completed:false,createdAt:new Date().toISOString()}].concat(p)})}resetIF()}
  function resetIF(){setIFT("");setIFD("");setIFDL("");setIFE(null);setSIF(false)}
  function editIt(i){setIFT(i.title);setIFD(i.desc||"");setIFDL(i.deadline||"");setIFE(i.id);setSIF(true);setTab("it")}
  function toggleIt(id){setIT(function(p){return p.map(function(i){return i.id===id?Object.assign({},i,{completed:!i.completed}):i})})}
  function delIt(id){setIT(function(p){return p.filter(function(i){return i.id!==id})})}

  var fIt=useMemo(function(){
    var s=itItems.slice().sort(function(a,b){
      if(a.completed!==b.completed)return a.completed?1:-1;
      if(a.deadline&&!b.deadline)return-1;if(!a.deadline&&b.deadline)return 1;
      if(a.deadline&&b.deadline)return new Date(a.deadline)-new Date(b.deadline);return 0;
    });

    if(itFilter==="completed")return s.filter(function(i){return i.completed});

  },[itItems,itFilter]);
  var itPending=itItems.filter(function(i){return!i.completed}).length;

  /* STAFF FN */
  function addStaff2(){if(!newSN.trim()||staffList.includes(newSN.trim()))return;var u=staffList.concat([newSN.trim()]);setSL(u);setNSN("");if(!selStaff)setSS(newSN.trim())}
  function rmStaff(n){(staffIssues[n]||[]).forEach(function(iss){deleteDriveFiles(iss.files)});setSL(function(p){return p.filter(function(x){return x!==n})});var ni=Object.assign({},staffIssues);delete ni[n];setSI(ni);if(selStaff===n)setSS("")}
  function addIssue(){if(!siTitle.trim()||!selStaff)return;if(siEditId){setSI(function(p){var ni=Object.assign({},p);ni[selStaff]=(ni[selStaff]||[]).map(function(i){return i.id===siEditId?Object.assign({},i,{title:siTitle,desc:siDesc,date:siDate,files:siFiles}):i});return ni})}else{setSI(function(p){var ni=Object.assign({},p);ni[selStaff]=[{id:gid(),title:siTitle,desc:siDesc,date:siDate,files:siFiles,createdAt:new Date().toISOString()}].concat(ni[selStaff]||[]);return ni})}resetSIF()}

  async function onSIFile(e){var fs=await doUploadFiles(e.target.files);setSIFiles(function(p){return p.concat(fs)});e.target.value=""}

  function resetNF(){setNFT("");setNFC("");setNFE(null);setSNF(false)}

  /* SEASONAL REPORT FN */
  function addSR(){if(!srfTitle.trim())return;if(srfEditId){setSR(function(p){return p.map(function(s){return s.id===srfEditId?Object.assign({},s,{title:srfTitle,content:srfContent,date:srfDate,quarter:srfQ,year:srfYear}):s})})}else{setSR(function(p){return[{id:gid(),title:srfTitle,content:srfContent,date:srfDate,quarter:srfQ,year:srfYear,createdAt:new Date().toISOString()}].concat(p)})}resetSRF()}

      var dd=diffDays(d.deadline);var item={type:"duty",id:d.id,title:d.title,desc:d.desc,deadline:d.deadline,priority:d.priority,raw:d};

    });
    itItems.filter(function(i){return!i.completed}).forEach(function(i){
      var dd=diffDays(i.deadline);var item={type:"it",id:i.id,title:i.title,desc:i.desc,deadline:i.deadline,raw:i};

      {/* Year picker */}
      <div className="flex gap-2 overflow-x-auto hideScroll pb-1">
        {srYears.map(function(y){return<button key={y} onClick={function(){setSRY(y)}} className={srYear===y?"px-4 py-2 rounded-xl text-sm font-bold bg-gradient-to-r from-teal-500 to-emerald-500 text-white shadow-sm":"px-4 py-2 rounded-xl text-sm font-bold bg-gray-100 text-gray-500 border border-gray-200"}>{y}</button>})}
      </div>

      {/* Quarter picker */}
      <div className="grid grid-cols-4 gap-2">
        {["Q1","Q2","Q3","Q4"].map(function(q){var qci=Q_COLORS[q];var isActive=srQ===q;var cnt=srCountByQ[q]||0;var isCur=q===curQuarter()&&srYear===curYear();
          return<button key={q} onClick={function(){setSRQ(q)}} className={"py-3 rounded-xl text-center border-2 transition-all "+(isActive?qci.bg+" "+qci.bd+" ring-2 ring-opacity-30 "+(q==="Q1"?"ring-sky-300":q==="Q2"?"ring-emerald-300":q==="Q3"?"ring-amber-300":"ring-orange-300"):"bg-white border-gray-200")}>
            <div className="text-lg">{qci.icon}</div>
            <div className={"text-sm font-bold "+(isActive?"text-gray-800":"text-gray-500")}>{q}</div>
            <div className="text-xs text-gray-400">{qci.label}</div>
            {cnt>0&&<div className={"text-xs font-bold mt-0.5 px-1.5 py-0.5 rounded-full inline-block "+qci.badge}>{cnt}筆</div>}
            {isCur&&cnt===0&&<div className="text-xs font-bold mt-0.5 text-gray-300">← 當季</div>}
          </button>
        })}
      </div>

      {/* Add form */}
      {showSRF&&<div className={"bg-white rounded-2xl p-4 shadow-sm border-2 border-teal-200 space-y-3 fadeIn"}>
        <input value={srfTitle} onChange={function(e){setSRFT(e.target.value)}} placeholder="做咗咩？（標題）..." className={IC} autoFocus/>
        <textarea value={srfContent} onChange={function(e){setSRFC(e.target.value)}} placeholder="詳細內容 / 成果描述..." rows={4} className={IC}/>
        <div className="grid grid-cols-2 gap-2">
          <div><label className="text-xs font-bold text-gray-500 mb-1 block">📅 日期（選填）</label><ClearDate value={srfDate} onChange={setSRFD}/></div>
          <div><label className="text-xs font-bold text-gray-500 mb-1 block">📊 歸入季度</label>
            <div className="flex gap-1.5">
              <select value={srfQ} onChange={function(e){setSRFQ(e.target.value)}} className={IC} style={{flex:1}}>
                <option value="Q1">Q1</option><option value="Q2">Q2</option><option value="Q3">Q3</option><option value="Q4">Q4</option>
              </select>
              <select value={srfYear} onChange={function(e){setSRFY(Number(e.target.value))}} className={IC} style={{flex:1}}>
                {srYears.concat(srYears.indexOf(curYear()+1)<0?[curYear()+1]:[]).sort(function(a,b){return b-a}).map(function(y){return<option key={y} value={y}>{y}</option>})}
              </select>
            </div>
          </div>
        </div>
        <div className="flex gap-2"><button onClick={addSR} className={"flex-1 "+BTN}>{srfEditId?"✓ 儲存":"+ 新增記錄"}</button><button onClick={resetSRF} className={BTN2}>取消</button></div>
      </div>}

      {/* Summary */}
      <div className={"rounded-2xl p-4 border-2 "+qc.bg+" "+qc.bd}>
        <div className="flex items-center gap-2 mb-1">
          <span className="text-2xl">{qc.icon}</span>
          <span className="text-lg font-black text-gray-800">{srYear} {srQ}</span>
          <span className={"text-xs font-bold px-2 py-0.5 rounded-full "+qc.badge}>{filteredSR.length} 筆記錄</span>
        </div>
        <div className="text-xs text-gray-500">{qc.label}</div>
      </div>

      {/* Items */}
      {filteredSR.length===0?<Empty icon="📊" title={"未有 "+srYear+" "+srQ+" 嘅記錄"} sub="撳「新增」記錄你呢季做過嘅嘢"/>:
      <div className="space-y-2.5">{filteredSR.map(function(s,idx){
        var isExp=!!expandedSR[s.id];var isLong=s.content&&s.content.length>150;
        return<div key={s.id} className={"bg-white rounded-2xl shadow-sm border-2 overflow-hidden fadeIn "+qc.bd}>
          <div className="flex">
            <div className={"w-1.5 shrink-0 "+qc.bar}/>
            <div className="flex-1 p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <span className={"text-xs font-bold px-2 py-0.5 rounded-full "+qc.badge}>{qc.icon} {s.quarter}</span>
                    {s.date&&<span className="text-xs font-bold text-gray-400">📅 {fmtDate(s.date)}</span>}
                  </div>
                  <div className="text-sm font-black text-gray-800 mb-1">{s.title}</div>
                  {s.content&&<div className={"text-sm text-gray-600 whitespace-pre-wrap leading-relaxed "+(isLong&&!isExp?"line-clamp-2":"")}>{s.content}</div>}
                  {isLong&&<button onClick={function(){setESR(function(p){var x=Object.assign({},p);x[s.id]=!x[s.id];return x})}} className="text-xs font-bold text-teal-500 mt-1.5">{isExp?"收起 ▲":"展開全部 ▼"}</button>}
                </div>
                <div className="flex flex-col gap-1 shrink-0">
                  <button onClick={function(){editSR(s)}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">✏️</button>
                  <button onClick={function(){setCD({fn:function(){delSR(s.id)},title:"刪除記錄？",msg:s.title})}} className="w-8 h-8 rounded-lg bg-gray-50 flex items-center justify-center text-gray-400">🗑</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      })}</div>}
    </div>
  }

  function renderSync(){
    if(syncing)return<div className="flex items-center gap-1.5"><div className="w-3 h-3 border-2 border-white border-t-transparent rounded-full spin"/><span className="text-xs opacity-80">同步中…</span></div>;
    if(lastSaved)return<div className="flex items-center gap-1.5"><span className="text-xs opacity-50">✓ 已儲存 {lastSaved.getHours()+":"+String(lastSaved.getMinutes()).padStart(2,"0")}</span></div>;
    return null;
  }

  return<div className="min-h-screen bg-gray-50 pb-8">
    <div className="hdr-bg px-5 pt-6 pb-8 text-white relative overflow-hidden">
      <div className="hdr-circle absolute top-0 right-0 w-40 h-40 bg-white opacity-10 rounded-full" style={{transform:"translate(30px,-30px)"}}/>
      <div className="hdr-circle absolute bottom-0 left-0 w-24 h-24 bg-white opacity-5 rounded-full" style={{transform:"translate(-10px,10px)"}}/>
      <div className="relative max-w-2xl mx-auto">
        <div className="text-xs opacity-70 tracking-wider mb-1">📋 WORK MANAGEMENT</div>
        <div className="text-xl font-extrabold">Work Dashboard</div>
        <div className="flex items-center justify-between">
          <div className="text-xs opacity-50">備忘錄 · 任務管理 · 會議紀錄</div>
          {renderSync()}
        </div>
      </div>
    </div>
    <div className="sticky top-0 z-40 bg-white border-b border-gray-200 overflow-x-auto hideScroll shadow-sm" style={{transform:"translateZ(0)"}}>
      <div className="flex gap-1 px-3 py-2" style={{minWidth:"max-content"}}>
        {TABS.map(function(t){return<button key={t.id} onClick={function(){setTab(t.id)}} className={tab===t.id?"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow":"px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap text-gray-500 hover:bg-gray-100"}>
          {t.icon} {t.label}
          {t.count>0&&<span className={"ml-1 text-xs px-1.5 py-0.5 rounded-full "+(tab===t.id?"bg-white bg-opacity-30":"bg-gray-200 text-gray-500")}>{t.count}</span>}
        </button>})}
      </div>
    </div>
    <div className="max-w-4xl mx-auto px-4 py-5">
      {tab==="today"&&renderToday()}
      {tab==="duty"&&renderDuty()}
      {tab==="it"&&renderIT()}
      {tab==="staff"&&renderStaff()}
      {tab==="notes"&&renderNotesTab()}
    </div>
    <FileModal file={previewFile} onClose={function(){setPF(null)}}/>
    <ConfirmModal show={!!confirmDel} title={confirmDel?confirmDel.title:""} msg={confirmDel?confirmDel.msg:""} onYes={function(){if(confirmDel)confirmDel.fn();setCD(null)}} onNo={function(){setCD(null)}}/>
  </div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
